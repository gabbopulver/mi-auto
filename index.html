<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<title>¿Dónde está el auto?</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: una sola columna, dos pantallas (marcar / buscar), botón principal abajo al alcance del pulgar */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --fg:#15191e; --muted:#5d6670; --line:#d9ddd8;
  --accent:#e8a400; --accent-fg:#15191e; --go:#1f8a5b; --warn:#b4541a;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14181d; --surface:#1e242b; --fg:#eef0ec; --muted:#9aa3ab; --line:#313a43;
  --accent:#ffbf1f; --accent-fg:#14181d; --go:#3fc488; --warn:#f08a4b; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);
  padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);
  display:flex;flex-direction:column;max-width:520px;margin:0 auto;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;justify-content:space-between;padding-block:14px 6px}
header h1{font-size:1.05rem;margin:0;letter-spacing:.01em}
.sign{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#1d5fbf;color:#fff;font-weight:800;margin-right:8px;font-size:18px}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:8px 16px;min-height:0}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-variant-numeric:tabular-nums;min-width:48px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:16px;width:100%;cursor:pointer}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg);font-size:1.15rem;padding:20px}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:10px;display:block}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}
.warn{color:var(--warn)}
/* Pantalla buscar */
.compass{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:min(78vw,320px);width:100%;margin:0 auto}
.dial{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.arrow{width:62%;height:62%;transition:transform .15s linear}
.arrow path{fill:var(--accent);stroke:var(--fg);stroke-width:3;stroke-linejoin:round}
.dist{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:2.6rem;font-weight:700;line-height:1;margin:0}
.dist small{font-size:1rem;color:var(--muted);font-weight:400}
.near .arrow path{fill:var(--go)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.big-level{font-family:var(--mono);font-size:1.6rem}
a.link{color:var(--fg)}
.stack{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){.arrow{transition:none}}
</style>
</head>
<body>
<header>
  <h1><span class="sign" aria-hidden="true">P</span>¿Dónde está el auto?</h1>
  <span id="when" class="status"></span>
</header>

<!-- PANTALLA 1: marcar -->
<main id="markView">
  <section class="card">
    <p class="label">Nivel</p>
    <div class="chips" id="levels" role="group" aria-label="Nivel">
      <!-- generado -->
    </div>
  </section>
  <section class="card stack">
    <p class="label">Lugar (columna, sector, cerca de…)</p>
    <input type="text" id="spot" placeholder="Ej.: Columna B-14, cerca del ascensor" autocomplete="off">
    <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
    <button class="btn ghost photo-btn" id="photoBtn" type="button">📷 Sacar foto del lugar</button>
    <img id="photoPreview" class="thumb" alt="Foto del lugar" hidden>
  </section>
  <div style="flex:1"></div>
  <p class="status" id="markStatus" role="status"></p>
  <button class="btn primary" id="parkBtn" type="button">Estacioné acá</button>
</main>

<!-- PANTALLA 2: buscar -->
<main id="findView" hidden>
  <div class="compass" id="compass">
    <div class="dial"></div>
    <svg class="arrow" id="arrow" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L84 88 L50 70 L16 88 Z"/></svg>
  </div>
  <p class="dist" id="dist">— <small>m</small></p>
  <p class="status" id="findStatus" role="status" style="text-align:center"></p>

  <section class="card">
    <dl class="facts">
      <dt>Nivel</dt><dd id="fLevel" class="big-level">—</dd>
      <dt>Lugar</dt><dd id="fSpot">—</dd>
      <dt>Hora</dt><dd id="fTime">—</dd>
    </dl>
    <img id="fPhoto" class="thumb" alt="Foto de donde dejaste el auto" hidden style="margin-top:12px">
  </section>
  <div class="stack">
    <a class="btn ghost link" id="mapsLink" target="_blank" rel="noopener" style="text-align:center;text-decoration:none" hidden>Abrir ruta a pie en Google Maps</a>
    <button class="btn primary" id="foundBtn" type="button">Ya encontré el auto</button>
  </div>
</main>

<script>
(() => {
  const KEY = 'auto.parking.v1';
  const $ = id => document.getElementById(id);
  const LEVELS = ['Afuera','-3','-2','-1','0','1','2','3'];
  let draft = { level: null, spot: '', photo: null };
  let parked = load();

  function load(){ try { return JSON.parse(localStorage.getItem(KEY)) } catch { return null } }
  function save(v){ try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); return true } catch { return false } }

  // ---------- Pantalla marcar ----------
  const levelsEl = $('levels');
  LEVELS.forEach(l => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = l; b.setAttribute('aria-pressed','false');
    b.onclick = () => {
      draft.level = draft.level === l ? null : l;
      [...levelsEl.children].forEach(c => c.setAttribute('aria-pressed', String(c.textContent === draft.level)));
    };
    levelsEl.appendChild(b);
  });
  $('spot').oninput = e => draft.spot = e.target.value;
  $('photoBtn').onclick = () => $('photoInput').click();
  $('photoInput').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    draft.photo = await shrink(f, 1024, .7);
    $('photoPreview').src = draft.photo; $('photoPreview').hidden = false;
    $('photoBtn').textContent = '📷 Cambiar foto';
  };

  function shrink(file, max, q){
    return new Promise((res, rej) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = rej; img.src = url;
    });
  }

  // Toma la mejor lectura de GPS en hasta 10 s. En subsuelos puede no haber ninguna.
  function bestFix(ms = 10000, good = 12){
    return new Promise(resolve => {
      if (!('geolocation' in navigator)) return resolve(null);
      let best = null;
      const id = navigator.geolocation.watchPosition(p => {
        if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
        $('markStatus').textContent = `Ubicando… precisión ${Math.round(best.coords.accuracy)} m`;
        if (best.coords.accuracy <= good) done();
      }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: ms });
      const t = setTimeout(done, ms);
      function done(){ clearTimeout(t); navigator.geolocation.clearWatch(id); resolve(best); }
    });
  }

  $('parkBtn').onclick = async () => {
    const btn = $('parkBtn'); btn.disabled = true; btn.textContent = 'Guardando…';
    $('markStatus').textContent = 'Buscando señal GPS…';
    askCompass(); // pedir permiso de brújula aprovechando el toque
    const fix = await bestFix();
    const rec = {
      t: Date.now(), level: draft.level, spot: draft.spot.trim(), photo: draft.photo,
      lat: fix?.coords.latitude ?? null, lng: fix?.coords.longitude ?? null, acc: fix?.coords.accuracy ?? null
    };
    let ok = save(rec);
    if (!ok && rec.photo){ rec.photo = null; ok = save(rec); } // sin espacio: guardar sin foto
    btn.disabled = false; btn.textContent = 'Estacioné acá';
    if (!ok){ $('markStatus').textContent = 'No se pudo guardar. Revisá que el navegador permita guardar datos.'; return; }
    parked = rec; navigator.vibrate?.(60); showFind();
  };

  // ---------- Pantalla buscar ----------
  let heading = null, pos = null, watchId = null, shown = 0, wake = null;

  function showFind(){
    $('markView').hidden = true; $('findView').hidden = false;
    $('fLevel').textContent = parked.level ?? '—';
    $('fSpot').textContent = parked.spot || '—';
    $('fTime').textContent = new Date(parked.t).toLocaleString('es', { weekday:'short', hour:'2-digit', minute:'2-digit' });
    $('when').textContent = 'Auto guardado';
    if (parked.photo){ $('fPhoto').src = parked.photo; $('fPhoto').hidden = false } else $('fPhoto').hidden = true;
    if (parked.lat != null){
      $('mapsLink').href = `https://www.google.com/maps/dir/?api=1&destination=${parked.lat},${parked.lng}&travelmode=walking`;
      $('mapsLink').hidden = false;
      startCompass(); startGps();
      try { navigator.wakeLock?.request('screen').then(w => wake = w).catch(()=>{}) } catch {}
    } else {
      $('mapsLink').hidden = true;
      $('dist').innerHTML = '— <small>m</small>';
      $('findStatus').textContent = 'No había señal GPS al estacionar. Guiate por el nivel y la foto.';
      $('compass').hidden = true;
    }
    render();
  }

  function showMark(){
    stopAll();
    draft = { level: null, spot: '', photo: null };
    $('spot').value = ''; $('photoPreview').hidden = true; $('photoBtn').textContent = '📷 Sacar foto del lugar';
    [...levelsEl.children].forEach(c => c.setAttribute('aria-pressed','false'));
    $('markStatus').textContent = ''; $('when').textContent = '';
    $('compass').hidden = false;
    $('findView').hidden = true; $('markView').hidden = false;
  }

  $('foundBtn').onclick = () => { save(null); parked = null; showMark(); };

  function startGps(){
    if (!('geolocation' in navigator)) return;
    watchId = navigator.geolocation.watchPosition(p => { pos = p.coords; render(); },
      err => { $('findStatus').textContent = err.code === 1 ? 'Activá el permiso de ubicación para ver la flecha.' : 'Sin señal GPS por ahora.'; },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  }

  async function askCompass(){
    try { if (typeof DeviceOrientationEvent?.requestPermission === 'function') await DeviceOrientationEvent.requestPermission(); } catch {}
  }
  function onOrient(e){
    let h = null;
    if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
    else if ((e.absolute || e.type === 'deviceorientationabsolute') && e.alpha != null) h = 360 - e.alpha;
    if (h == null) return;
    h = (h + (screen.orientation?.angle || 0)) % 360;
    heading = heading == null ? h : smooth(heading, h, .25);
    render();
  }
  const evt = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
  function startCompass(){ window.addEventListener(evt, onOrient) }
  function stopAll(){
    window.removeEventListener(evt, onOrient);
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null; pos = null; heading = null;
    try { wake?.release() } catch {} wake = null;
  }

  // ---------- Geometría ----------
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  function distance(a, b, c, d){
    const R = 6371000, dLat = rad(c - a), dLon = rad(d - b);
    const x = Math.sin(dLat/2)**2 + Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function bearing(a, b, c, d){
    const y = Math.sin(rad(d - b)) * Math.cos(rad(c));
    const x = Math.cos(rad(a))*Math.sin(rad(c)) - Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d - b));
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }
  function smooth(prev, next, k){ let d = ((next - prev + 540) % 360) - 180; return (prev + d * k + 360) % 360 }

  let lastBuzz = 0;
  function render(){
    if (!parked || parked.lat == null) return;
    if (!pos){ $('findStatus').textContent ||= 'Buscando tu ubicación…'; return; }
    const d = distance(pos.latitude, pos.longitude, parked.lat, parked.lng);
    const b = bearing(pos.latitude, pos.longitude, parked.lat, parked.lng);
    const acc = Math.max(pos.accuracy, parked.acc || 0);
    $('dist').innerHTML = d >= 1000 ? `${(d/1000).toFixed(2)} <small>km</small>` : `${Math.round(d)} <small>m</small>`;
    const near = d <= Math.max(10, acc * .6);
    $('compass').classList.toggle('near', near);

    let msg;
    if (near) msg = 'Estás muy cerca. Mirá la foto y el número de lugar.';
    else if (acc > 35) msg = `GPS impreciso (±${Math.round(acc)} m). Si estás bajo techo, guiate por el nivel y la foto.`;
    else if (heading == null) msg = 'La flecha indica el rumbo respecto al norte: girá hasta que apunte hacia arriba.';
    else msg = '';
    $('findStatus').textContent = msg;
    $('findStatus').classList.toggle('warn', acc > 35 && !near);

    const target = heading == null ? b : (b - heading + 360) % 360;
    shown += ((target - shown % 360 + 540) % 360) - 180; // giro por el camino más corto
    $('arrow').style.transform = `rotate(${shown}deg)`;

    if (near && Date.now() - lastBuzz > 8000){ navigator.vibrate?.([80,60,80]); lastBuzz = Date.now(); }
  }

  // Exponer funciones puras para pruebas
  window.__geo = { distance, bearing, smooth };

  if (parked) showFind();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
